name: Run Stock Scraper

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 檢出儲存庫代碼
      uses: actions/checkout@v3
    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: 執行選股腳本
      run: python main.py
