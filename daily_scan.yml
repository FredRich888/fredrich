name: Run Stock Scraper

# 設定觸發時間
on:
  schedule:
    # 這裡使用的是 UTC 時間，台灣時間是 UTC+8
    # 範例：台灣時間週一至週五下午 3:30 (15:30) 執行，對應 UTC 為 07:30
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 讓你可以在 GitHub 網頁上手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出儲存庫代碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行選股腳本
      run: python main.py
